<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Bigger Blanket</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>

body{margin:0;background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 320px) var(--bg) no-repeat;color:var(--text);font-family:'Nunito',system-ui,sans-serif;font-size:16px;line-height:1.35}
#app{max-width:440px;margin:0 auto;padding:24px 20px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,p{margin:0}
.brand{font-size:26px;font-weight:800;color:var(--accent)}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow)}

button{cursor:pointer}

.tile[aria-pressed="true"]{border:3px solid var(--accent);padding:8px;transform:rotate(-1.5deg)}
.top{display:flex;justify-content:space-between;align-items:center}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s ease both}

.sr{position:absolute;left:-9999px}

.back:active{transform:scale(.95)}
.msg{margin:0;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:18px;font-weight:600;color:var(--accent);background:var(--tint);border-radius:18px;padding:12px 14px;animation:rise .45s cubic-bezier(.34,1.56,.64,1) both}

textarea{width:100%;box-sizing:border-box;min-height:84px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);font-family:inherit;font-size:16px;color:var(--text)}

.dot{position:absolute;border-radius:6px;animation:bob 3s ease-in-out infinite}

h1,h2,.brand,.btn,.btn2,.chip{font-family:'Fredoka','Nunito',system-ui,sans-serif}
.hero p{color:#FFFFFF;font-size:15px;margin-top:8px}
.hero .brand{color:#FFFFFF}
.logo{display:flex;align-items:center;gap:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn,.btn2,.chip,.tile,.bc{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.btn:active,.btn2:active,.chip:active,.tile:active,.bc:active{transform:scale(.95)}
.thumb{flex:none;border-radius:8px}
.bc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
</style>
</head>

return '<div class="hero" style="text-align:center;padding:26px 20px">'+dots+'<div class="logo" style="justify-content:center">'+mini(cols({design:"classic"}),34)+'<span class="brand">Bigger Blanket</span></div><p>Tiny savings. Big comfort.</p></div><div style="display:flex;justify-content:center">'+grid(demo,38,260)+'</div><h2 style="font-size:28px;line-height:1.15;text-align:center">Save a little.<br>Watch it bloom.</h2><div class="card" style="display:flex;flex-direction:column;gap:12px">'+row(1,"Pick a goal and a design")+row(2,"Add money whenever you can")+row(3,"Watch your blanket fill with color")+'</div><button class="btn" data-a="start">Get started</button><p class="muted" style="text-align:center">Test version. No real money moves, and your blankets stay on this device.</p>'}

if(!S.blankets.length){h+='<div class="card" style="text-align:center"><div style="display:flex;justify-content:center;margin-bottom:10px">'+mini(cols({design:"face"}),140)+'</div><h2 style="font-size:20px">Start your first blanket</h2><p class="muted" style="margin-top:4px">Pick a goal and a design. It stays black and white until you save.</p></div>'}
else{var act2=S.blankets.filter(function(b){return filled(b)<100}).length,tot=S.blankets.reduce(function(a,b){return a+saved(b)},0),goals=S.blankets.reduce(function(a,b){return a+b.goal},0);h+='<div class="card" style="display:flex;justify-content:space-between;gap:8px;text-align:center"><div style="flex:1"><div style="font-size:26px;font-weight:800">'+act2+'</div><div class="muted">Active</div></div><div style="flex:1"><div style="font-size:26px;font-weight:800">'+(S.blankets.length-act2)+'</div><div class="muted">Finished</div></div><div style="flex:1.5"><div style="font-size:26px;font-weight:800">'+money(tot)+'</div><div class="muted">Saved of '+money(goals)+'</div></div></div>';S.blankets.forEach(function(b){var p=filled(b);h+='<button class="bc" data-a="open" data-id="'+b.id+'">'+mini(filled(b)?cols(b).map(function(c,i){return order(b.seed).indexOf(i)<p?c:GRAY}):gray(),64)+'<span style="flex:1"><span style="display:flex;justify-content:space-between;font-weight:800"><span>'+esc(b.name)+'</span><span>'+p+'%</span></span><span class="bar" style="display:block;margin:6px 0 4px"><i style="width:'+p+'%"></i></span><span class="muted">'+money(saved(b))+' of '+money(b.goal)+(b.bank?' · '+esc(b.bank):'')+'</span></span></button>'})}
h+=dueCard();h+='<button class="bc" data-a="bud"><span style="flex:none;width:44px;height:44px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:Fredoka,Nunito,sans-serif;font-weight:700;font-size:22px" aria-hidden="true">$</span><span style="flex:1"><span style="display:block;font-weight:800">Monthly budget</span><span class="muted">'+budSum()+'</span></span></button><button class="btn" data-a="new">New blanket</button><p class="muted" style="text-align:center">Test version. No real money moves, and your blankets stay on this device.</p><button class="btn2" data-a="fb">Send feedback</button>';return h}
function form(){var f=ui.f,h=hdr("Back")+'<h2 style="font-size:24px">What are you covering?</h2>';
h+='<div><label for="nm">Blanket name</label><input id="nm" type="text" maxlength="40" value="'+esc(f.name)+'"></div><div><label for="gl">Goal amount ($)</label><input id="gl" type="number" inputmode="decimal" min="10" value="'+esc(f.goal)+'"></div><div><label for="bk">Bank (optional)</label><input id="bk" type="text" maxlength="40" placeholder="Where you keep this money" value="'+esc(f.bank||"")+'"><p class="muted" style="margin-top:4px">Name only. Never enter account numbers.</p></div>';
h+='<div><label>Design</label><div class="tiles">';["face","heart","sun","classic"].forEach(function(k){h+='<button class="tile" data-a="pick" data-d="'+k+'" aria-pressed="'+(f.design===k)+'">'+mini(cols({design:k}),88)+DES[k].n+'</button>'});
h+='<button class="tile" data-a="pick" data-d="photo" aria-pressed="'+(f.design==="photo")+'">'+mini(f.colors||gray(),88)+'Your photo</button></div></div>';
if(f.design==="photo")h+='<div class="note"><label for="ph" style="color:inherit">Choose a photo. We turn it into a 10 by 10 color mosaic, and the photo never leaves your device.</label><input id="ph" type="file" accept="image/*" style="margin-top:6px"></div>';
if(ui.err)h+='<p role="alert" style="color:var(--accent);font-weight:800">'+esc(ui.err)+'</p>';
return h+'<button class="btn" data-a="create">Create blanket</button>'}
function whatif(b,w){var rem=Math.max(0,b.goal-saved(b)),wk=Math.ceil(rem/w),d=new Date(Date.now()+wk*6048e5),s="$"+w+" a week finishes in "+wk+(wk===1?" week":" weeks")+", around "+d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+".",w2=Math.ceil(rem/(w+10));if(w2<wk)s+=" Add $10 more a week and you finish "+(wk-w2)+(wk-w2===1?" week":" weeks")+" sooner.";return s}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fill()}

x.fillStyle="#FFFFFF";x.textAlign="center";x.font="700 64px Fredoka, Nunito, sans-serif";x.fillText(b.name,W/2,130);x.font="600 40px Nunito, sans-serif";x.fillText(filled(b)>=100?"Fully stitched!":filled(b)+"% stitched",W/2,195);
rr(x,90,250,900,900,40);var n=filled(b),o=order(b.seed),f={},cs=cols(b),i,s=84;for(i=0;i<n;i++)f[o[i]]=1;
for(i=0;i<100;i++){x.fillStyle=f[i]?cs[i]:"#C9CFCB";rr(x,120+(i%10)*s+4,280+Math.floor(i/10)*s+4,s-8,s-8,14)}
x.fillStyle="#FFFFFF";x.font="700 48px Fredoka, Nunito, sans-serif";x.fillText("Bigger Blanket",W/2,1250);x.font="600 32px Nunito, sans-serif";x.fillText("Tiny savings. Big comfort.",W/2,1300);
c.toBlob(function(bl){if(!bl)return;(window.claude?claude.use("downloads"):Promise.resolve(null)).then(function(d){if(!d){ui.msg="Saving images is not available here.";ui.newN=0;render();return}return d.save({filename:"my-blanket.png",data:bl}).then(function(){ui.msg="Your blanket image is ready to share.";ui.newN=0;render()})}).catch(function(e){if(!e||e.code!=="declined"){ui.msg="Could not save the image.";ui.newN=0;render()}})})}
function fbText(){return "Feedback on Bigger Blanket: "+({love:"Love it",ok:"It is okay",no:"Not for me"}[ui.fb.r]||"no rating")+(ui.fb.t?". "+ui.fb.t:"")}
function sendFb(){var f=ui.fb;if(!f.r&&!(f.t||"").trim()){f.s="empty";render();return}
(window.claude?Promise.all([claude.use("db"),claude.use("user")]):Promise.resolve([null,null])).then(function(r){var db=r[0],u=r[1];if(!db||!u)throw 0;return u.id().then(function(id){return db.collection("feedback").doc(id).set({rating:f.r,text:(f.t||"").trim(),at:Date.now(),blankets:S.blankets.length,deposits:S.blankets.reduce(function(a,b){return a+b.dep.length},0)})})}).then(function(){f.s="sent";render()}).catch(function(){f.s="copy";render()})}

[["love","Love it"],["ok","It is okay"],["no","Not for me"]].forEach(function(q){h+='<button class="chip" data-a="fbr" data-v="'+q[0]+'" aria-pressed="'+(f.r===q[0])+'">'+q[1]+'</button>'});

else if(a==="badd"){var bn=(ui.bn||"").trim(),ba=parseFloat(ui.ba);if(!bn||!(ba>0)){ui.msg="Add a name and an amount above $0.";render();return}var lb=(ui.bc||"").trim()||"Other";cats(bud()).forEach(function(k){if(k.toLowerCase()===lb.toLowerCase())lb=k});var dv=ui.bdd===""?null:parseInt(ui.bdd,10);if(dv!==null&&!(dv>=1&&dv<=31)){ui.msg="Due day must be a number from 1 to 31.";render();return}var ex=ui.be?bud().items.filter(function(x){return x.id===ui.be})[0]:null;if(ex){ex.n=bn;ex.c=lb;ex.a=Math.round(ba*100)/100;ex.r=ui.br;ex.d=dv}else bud().items.push({id:"x"+Date.now(),n:bn,c:lb,a:Math.round(ba*100)/100,r:ui.br,d:dv});save();ui.msg=ex?"Changes saved.":"Expense added.";ui.bn="";ui.ba="";ui.bc="";ui.bdd="";ui.be="";ui.br=false;render()}
else if(a==="bdel"){if(ui.be===d.id)ui.be="";var bd=bud();bd.items=bd.items.filter(function(x){return x.id!==d.id});save();ui.msg="";render()}
else if(a==="bedit"){var bx=bud().items.filter(function(x){return x.id===d.id})[0];if(bx){ui.be=bx.id;ui.bn=bx.n;ui.ba=String(bx.a);ui.bc=bx.c||"Other";ui.bdd=bx.d?String(bx.d):"";ui.br=!!bx.r;ui.msg="";render();var e3=document.getElementById("bn");if(e3)e3.scrollIntoView({block:"center"})}}
else if(a==="bcancel"){ui.be="";ui.bn="";ui.ba="";ui.bc="";ui.bdd="";ui.br=false;render()}
else if(a==="brec"){ui.br=!ui.br;render()}
else if(a==="bpick"){ui.bs=d.id;render()}
else if(a==="bstitch"){var bl2=budCalc(bud()).left,tb=find(d.id);if(!tb){ui.msg="Create a blanket first.";render();return}if(!(bl2>=1)){ui.msg="Nothing left over yet. Add your income and spending first.";render();return}var am2=Math.floor(bl2),wasDone=filled(tb)>=100;tb.dep.push({a:am2,t:Date.now()});bud().items.push({id:"x"+Date.now(),n:"Stitched into "+tb.name,c:"Savings",a:am2});save();ui.msg=money(am2)+" stitched into "+tb.name+". Nice work!";render();if(!wasDone&&filled(tb)>=100)confetti()}
else if(a==="buse"){var bl=budCalc(bud()).left;if(!(bl>=22)){ui.msg="Add your income and spending first, with some left over.";render();return}ui.wi=Math.min(200,Math.max(5,Math.round(bl/4.33/5)*5));ui.msg="Done! The what-if slider on your blankets now starts at "+money(ui.wi)+" a week.";render()}
else if(a==="rpick"){ui.rd=d.d;render()}
else if(a==="rencancel"){ui.ren=false;render()}
else if(a==="rensave"&&b){var nm2=(ui.rn||"").trim(),g2=parseFloat(ui.rg);if(!nm2){ui.msg="Give your blanket a name.";render();return}if(!(g2>=10)){ui.msg="Set a goal of at least $10.";render();return}if(ui.rd==="photo"&&!ui.rc){ui.msg="Choose a photo first, or pick another design.";render();return}b.name=nm2;b.goal=g2;b.bank=(ui.rbk||"").trim();b.design=ui.rd;b.colors=ui.rd==="photo"?ui.rc:null;save();ui.ren=false;ui.newN=0;ui.msg="Changes saved.";render()}
else if(a==="del"&&b){if(!ui.del){ui.del=true;render();return}S.blankets=S.blankets.filter(function(x){return x.id!==b.id});save();go("home")}}
document.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(t)act(t.dataset.a,t.dataset)});
document.addEventListener("keydown",function(e){var t=e.target;if((e.key==="Enter"||e.key===" ")&&t.getAttribute&&t.getAttribute("role")==="button"&&t.dataset&&t.dataset.a){e.preventDefault();act(t.dataset.a,t.dataset)}});
document.addEventListener("input",function(e){var i=e.target.id;if(i==="nm")ui.f.name=e.target.value;else if(i==="gl")ui.f.goal=e.target.value;else if(i==="am")ui.amt=e.target.value;else if(i==="rn")ui.rn=e.target.value;else if(i==="rg")ui.rg=e.target.value;else if(i==="bk")ui.f.bank=e.target.value;else if(i==="rb")ui.rbk=e.target.value;else if(i==="sn")ui.sqn=e.target.value;else if(i==="ft")ui.fb.t=e.target.value;else if(i==="bi"){var bd2=bud();bd2.income=parseFloat(e.target.value)||0;save();budLive()}else if(i==="bn")ui.bn=e.target.value;else if(i==="ba")ui.ba=e.target.value;else if(i==="bc")ui.bc=e.target.value;else if(i==="bd")ui.bdd=e.target.value;else if(i==="wi"){ui.wi=+e.target.value;var b2=ui.id?find(ui.id):null;if(b2){document.getElementById("wo").textContent=whatif(b2,ui.wi);document.getElementById("wl").textContent="$"+ui.wi+" a week"}}});
document.addEventListener("change",function(e){var pid=e.target.id;if((pid!=="ph"&&pid!=="ph2")||!e.target.files[0])return;var url=URL.createObjectURL(e.target.files[0]),im=new Image();
im.onload=function(){var c=document.createElement("canvas"),x=c.getContext("2d"),s=Math.min(im.width,im.height);c.width=c.height=100;x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,100,100);var px=x.getImageData(0,0,100,100).data,out=[],r,cc,yy,xx,R,G,B;
for(r=0;r<10;r++)for(cc=0;cc<10;cc++){R=G=B=0;for(yy=0;yy<10;yy++)for(xx=0;xx<10;xx++){var k=((r*10+yy)*100+cc*10+xx)*4;R+=px[k];G+=px[k+1];B+=px[k+2]}out.push("rgb("+Math.round(R/100)+","+Math.round(G/100)+","+Math.round(B/100)+")")}
if(pid==="ph")ui.f.colors=out;else ui.rc=out;ui.err="";URL.revokeObjectURL(url);render()};
im.onerror=function(){ui.err="That photo could not be read. Try a JPG or PNG.";URL.revokeObjectURL(url);render()};im.src=url});
load();rollMonth();if(!S.welcomed&&!S.blankets.length)ui.view="welcome";render();
